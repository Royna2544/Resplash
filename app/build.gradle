import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    alias libs.plugins.android.application
    alias libs.plugins.kotlin.parcelize
    alias libs.plugins.ksp
    alias libs.plugins.oss.licenses
}

// Firebase needs a google-services.json that is not checked into version control.
// Keep the build working for contributors who do not have one.
def googleServicesAvailable = file('google-services.json').exists()
if (googleServicesAvailable) {
    apply plugin: libs.plugins.google.services.get().pluginId
    apply plugin: libs.plugins.firebase.crashlytics.get().pluginId
} else {
    logger.lifecycle('google-services.json not found, building without the Firebase Gradle plugins')
}

// Load local properties with API keys
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

/**
 * Values in local.properties are already quoted so that they can be passed to buildConfigField
 * verbatim. Fall back to an empty string literal when a key is missing so that the project can
 * still be built and inspected without a set of Unsplash API keys.
 */
def secret = { String key -> localProperties.getProperty(key) ?: '""' }

android {
    namespace 'com.b_lam.resplash'
    compileSdk libs.versions.compileSdk.get() as int

    defaultConfig {
        applicationId 'com.b_lam.resplash'
        minSdk libs.versions.minSdk.get() as int
        targetSdk libs.versions.targetSdk.get() as int
        versionCode 63
        versionName '3.4.3'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'RELEASE_APP_ID', secret('releaseAppId')
        buildConfigField 'String', 'RELEASE_SECRET', secret('releaseSecret')
        buildConfigField 'String', 'DEV_APP_ID', secret('devAppId')
        buildConfigField 'String', 'DEV_SECRET', secret('devSecret')
        buildConfigField 'String', 'GOOGLE_PLAY_LICENSE_KEY', secret('googlePlayLicenseKey')
        buildConfigField 'boolean', 'FIREBASE_ENABLED', googleServicesAvailable.toString()
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            applicationIdSuffix '.debug'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }

    lint {
        disable 'MissingTranslation'
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

ksp {
    arg('room.schemaLocation', "$projectDir/schemas".toString())
    arg('room.generateKotlin', 'true')
}

dependencies {
    // Support libraries
    implementation libs.androidx.appcompat
    implementation libs.androidx.browser
    implementation libs.androidx.cardview
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.core.ktx
    implementation libs.androidx.core.splashscreen
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.paging.runtime.ktx
    implementation libs.androidx.preference.ktx
    implementation libs.androidx.recyclerview
    implementation libs.androidx.swiperefreshlayout
    implementation libs.androidx.work.runtime.ktx

    // Lifecycle
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.service

    // Room
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler

    // Material components
    implementation libs.material

    // Billing
    implementation libs.billing.ktx

    // Kotlin coroutines
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android

    // OkHttp
    implementation libs.okhttp
    implementation libs.okhttp.logging.interceptor

    // Okio
    implementation libs.okio

    // Retrofit
    implementation libs.retrofit
    implementation libs.retrofit.converter.moshi

    // Moshi
    implementation libs.moshi
    ksp libs.moshi.kotlin.codegen

    // Glide
    implementation libs.glide
    ksp libs.glide.ksp

    // Koin
    implementation libs.koin.android
    implementation libs.koin.androidx.workmanager

    // Firebase
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation libs.firebase.crashlytics
    implementation(libs.firebase.inappmessaging) {
        exclude group: 'io.grpc', module: 'grpc-okhttp'
    }
    // Workaround for https://github.com/firebase/firebase-android-sdk/issues/2642
    implementation libs.grpc.okhttp
    implementation libs.firebase.firestore

    // View binding
    implementation libs.viewbindingpropertydelegate

    // Lottie
    implementation libs.lottie

    // PhotoView
    implementation libs.photoview

    // Pager indicator
    implementation libs.overflow.pager.indicator

    // PrettyTime
    implementation libs.prettytime

    // Open source notices
    implementation libs.play.services.oss.licenses

    // Muzei
    implementation libs.muzei.api

    // LeakCanary
    debugImplementation libs.leakcanary.android

    // Unit tests
    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.androidx.test.ext.junit

    // Room testing
    androidTestImplementation libs.androidx.room.testing
}
